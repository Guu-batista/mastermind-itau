<div class="wrap">
  <div class="card">
    <h1>Entrar</h1>
    <p class="sub">Use usuário ou e-mail e sua senha.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>
        <span>Usuário / e-mail</span>
        <input formControlName="username_or_email" placeholder="ex: guilherme" />
        @if (form.controls.username_or_email.touched && form.controls.username_or_email.invalid) {
          <small class="err">Informe um usuário/e-mail válido.</small>
        }
      </label>

      <label>
        <span>Senha</span>
        <input type="password" formControlName="password" placeholder="••••••••" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="err">Informe sua senha.</small>
        }
      </label>

      @if (error()) {
        <div class="alert">{{ error() }}</div>
      }

      <button class="btn" type="submit" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <div class="footer">
      <a class="btn" routerLink="/register">Criar conta</a>
    </div>
  </div>
</div>
